# Release the rail0-sdk gem when an approved release pull request merges.
#
# Releasing is three steps:
#   1. bin/release-prepare opens "chore(release): vX.Y.Z", which bumps Rail0::VERSION
#      (and Gemfile.lock) and carries the release notes in its body;
#   2. a reviewer approves it and it is merged;
#   3. this workflow, on that push to main: plan → gate (ci.yml on the release commit)
#      → gem push → tag vX.Y.Z + GitHub release → Slack.
#
# Why on merge, not on a published GitHub release: a release used to be a second, manual
# and unreviewed act (draft a release, type a tag) after the version PR merged, and
# nothing stopped a tag on the wrong commit. Now the reviewed pull request IS the
# release, and the tag is created only by this workflow, only after RubyGems.org
# accepted the gem. A push that does not change the version is a no-op (plan stops).
# `rake release` (tag + push + gem push from a laptop) is disabled in the Rakefile.
#
# Order: publish FIRST, tag after. A failed push leaves no tag, so the release is
# simply retried; a failed tag/release step after a successful push is resumed by
# "Run workflow" (workflow_dispatch, main only): plan sees the version on RubyGems.org
# without its tag and does only what is missing.
#
# The release commit is the one that SET the version (the release PR's merge), found from
# history, not the head of main: a resume after other merges still ships exactly the
# reviewed commit.
#
# Trusted Publishing (OIDC): RubyGems.org trusts THIS file (release.yml) in THIS repo —
# keep the name. No API key exists anywhere. One-time setup on rubygems.org: rail0-sdk →
# Trusted publishers → GitHub Actions, repository `commercelayer/rail0-ruby`, workflow
# `release.yml`, environment `release` (bind the environment only AFTER this workflow is
# on main: the old one ran without it).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch: # resume a release that stopped halfway; refused off main

permissions:
  contents: read

# One release at a time, never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: rail0-sdk

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::releases run from main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history (the commit that set the version) and tags

      - name: What to release
        id: plan
        run: |
          set -euo pipefail
          version_at() {
            git show "$1:lib/rail0/version.rb" 2>/dev/null | sed -n 's/^ *VERSION = "\([^"]*\)".*$/\1/p' | head -n 1 || true
          }

          version="$(version_at HEAD)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Rail0::VERSION '$version' is not X.Y.Z"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

          published=false
          if curl -fsS "https://rubygems.org/api/v1/versions/$PACKAGE.json" |
            jq -e --arg v "$version" 'any(.[]; .number == $v)' >/dev/null 2>&1; then
            published=true
          fi
          tagged=false
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && tagged=true

          if [ "$published" = true ] && [ "$tagged" = true ]; then
            echo "::notice::$PACKAGE $version is on RubyGems.org and tagged $tag: nothing to release"
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The commit that set this version: the newest first-parent commit of main whose
          # version differs from its parent's.
          commit=""
          for c in $(git log --first-parent --format=%H -- lib/rail0/version.rb); do
            if [ "$(version_at "$c")" = "$version" ] && [ "$(version_at "$c^1")" != "$version" ]; then
              commit="$c"
              break
            fi
          done
          if [ -z "$commit" ]; then
            echo "::error::cannot find the commit that set version $version"
            exit 1
          fi

          if [ "$tagged" = true ]; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tag_commit" != "$commit" ]; then
              echo "::error::tag $tag is on $tag_commit, but $version was set by $commit"
              exit 1
            fi
          else
            latest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "::error::$version is older than the latest tag $latest"
              exit 1
            fi
          fi

          echo "release=true" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          if [ "$published" = true ]; then echo "publish=false" >>"$GITHUB_OUTPUT"; else echo "publish=true" >>"$GITHUB_OUTPUT"; fi
          {
            echo "### Releasing $PACKAGE $version"
            echo "- commit: \`$commit\`"
            echo "- on RubyGems.org already: $published"
            echo "- tagged already: $tagged"
          } >>"$GITHUB_STEP_SUMMARY"

  gate:
    name: CI on the release commit
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  publish:
    name: Publish, tag, release
    needs: [plan, gate]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://rubygems.org/gems/rail0-sdk/versions/${{ needs.plan.outputs.version }}
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # the OIDC token RubyGems.org exchanges for a short-lived push key
      pull-requests: read # the release notes, from the release PR's body
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}

      # `gem build` needs Ruby alone: no bundle, so no libsecp256k1 (that is for the specs,
      # and the gate already ran them on this commit).
      - uses: ruby/setup-ruby@v1
        if: needs.plan.outputs.publish == 'true'
        with:
          ruby-version: "3.3"

      - name: Build the gem
        if: needs.plan.outputs.publish == 'true'
        run: gem build rail0-sdk.gemspec --output "rail0-sdk-${VERSION}.gem"

      - name: Configure Trusted Publishing credentials
        if: needs.plan.outputs.publish == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems.org
        if: needs.plan.outputs.publish == 'true'
        run: gem push "rail0-sdk-${VERSION}.gem"

      - name: Release notes from the release pull request
        id: notes
        run: |
          set -euo pipefail
          number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" \
            --jq '[.[] | select(.merged_at != null and (.title | startswith("chore(release)")) and (.title | contains(env.TAG)))][0].number // empty' || true)"
          if [ -z "$number" ]; then
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --search "\"chore(release): $TAG\" in:title" \
              --json number,title --jq '[.[] | select(.title | contains(env.TAG))][0].number // empty' || true)"
          fi
          if [ -z "$number" ]; then
            echo "::notice::no merged release pull request for $TAG found: GitHub generates the notes"
            exit 0
          fi
          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body >"$RUNNER_TEMP/pr-body.md"
          awk '/<!-- release-notes:end -->/ { inside = 0 } inside { print } /<!-- release-notes:start -->/ { inside = 1 }' \
            "$RUNNER_TEMP/pr-body.md" >"$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || cp "$RUNNER_TEMP/pr-body.md" "$RUNNER_TEMP/notes.md"
          printf '\nRelease pull request: #%s\n' "$number" >>"$RUNNER_TEMP/notes.md"
          echo "file=$RUNNER_TEMP/notes.md" >>"$GITHUB_OUTPUT"

      # `gh release create --target` creates the tag on the release commit and the
      # release in one call. Skipped when the release already exists (a resume).
      - name: Tag and GitHub release
        env:
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists"
            exit 0
          fi
          if [ -n "${NOTES_FILE:-}" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "$TAG" --generate-notes
          fi

  announce:
    name: Slack message
    needs: [plan, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    env:
      # The channel: swap the secret here (one place) to post somewhere else.
      SLACK_WEBHOOK_URL: ${{ secrets.PIPELINE_SLACK_CHANNEL_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: No Slack webhook
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "::warning::the Slack webhook secret is not available to this repository; no message posted"

      - name: Post to a Slack channel
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook-type: incoming-webhook
          payload: |
            {
            "text": "New release rail0-sdk v${{ needs.plan.outputs.version }}.",
            "blocks": [
              {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "New release for <https://rubygems.org/gems/rail0-sdk/versions/${{ needs.plan.outputs.version }}|`rail0-sdk`>\n*<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}|release notes>*"
              }
              },
              {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*Package:*\nrail0-sdk" },
                { "type": "mrkdwn", "text": "*Version:*\n${{ needs.plan.outputs.version }}" }
              ]
              },
              {
              "type": "context",
              "elements": [
                { "type": "image", "image_url": "${{ github.event.sender.avatar_url }}", "alt_text": "${{ github.event.sender.login }}" },
                { "type": "mrkdwn", "text": "*${{ github.event.sender.login }}* has triggered this release." }
              ]
              }
            ]
            }
