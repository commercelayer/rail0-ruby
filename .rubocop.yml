inherit_from: .rubocop-shared.yml

# ── rail0-ruby specifics ──────────────────────────────────────────────────────
#
# The shared file above holds the rules every rail0 Ruby repo shares. What follows is only
# what the SDK's own shape and test framework need.
#
# One block per cop, deliberately: a repeated `Metrics/AbcSize:` key does not merge in YAML,
# it REPLACES — this file used to carry two of them, and the first (Max: 25) had been dead
# since the second was added.
plugins:
  - rubocop-rspec

AllCops:
  # Matches the gemspec, which is the contract — not the newest thing that happens to work.
  TargetRubyVersion: 3.0
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "gen/**/*"   # a build script that writes SDK files: not shipped, shaped by what it emits

# 120 comes from the shared file; these are the SDK's own exceptions to it. Data tables —
# stablecoins, error hints, type aliases — are one row per line by design, and a spec's stub
# URL or expected payload is harder to read wrapped than long.
Layout/LineLength:
  Exclude:
    - "lib/rail0/stablecoins.rb"
    - "lib/rail0/error_hints.rb"
    - "lib/rail0/types.rb"
    - "spec/**/*"

# ── Metrics: the SDK's shape, not a preference ────────────────────────────────
#
# Signing and error decoding are long by nature: a single EIP-712 payload or a revert decoder
# is one idea that happens to take thirty lines, and cutting it into named halves each called
# once would spread it rather than simplify it.
Metrics/MethodLength:
  Max: 30

# 40, for the HTTP send-and-retry path: the branching IS the feature (status classes, retry
# budgets, Retry-After, cancellation), and every keyword argument threaded through it counts
# as a branch to this cop.
Metrics/AbcSize:
  Max: 40
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12
Metrics/ClassLength:
  Max: 250
Metrics/ModuleLength:
  Max: 250
  Exclude:
    - "spec/**/*"

# An rspec `describe` is a block, and a long one is a well-covered subject rather than a
# smell. Same for the gemspec. 30 is for the HTTP retry loop: one `loop do` that owns attempt
# counting, backoff, Retry-After honouring and cancellation — splitting it hides the sequence.
Metrics/BlockLength:
  Max: 30
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# Chain ids and amounts are written the way they appear on chain and in the gateway's seeds —
# 84532, not 84_532 — so a value can be grepped across repos.
Style/NumericLiterals:
  Enabled: false

# A spec's `let` blocks legitimately define constants for the example group.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*"

# ── RSpec plugin: structure yes, counting and naming no ───────────────────────
#
# RSpec's own opinions about example length and count say nothing about whether the tests are
# good; the ones about structure are kept.
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/NestedGroups:
  Max: 4

# The specs name the class under test explicitly. `described_class` saves a line and costs a
# reader the answer to "what is this testing?" — worth it in a long file, not in these.
RSpec/DescribedClass:
  Enabled: false

# The spec directory is FLAT (client_spec.rb, signing_spec.rb, analytics_spec.rb) and mirrors
# the SDK's surface rather than its file tree, so a reader looking for "how do I use
# analytics" finds one file. Requiring spec/rail0/resources/analytics_spec.rb would nest every
# file one deep to satisfy a naming rule.
RSpec/SpecFilePathFormat:
  Enabled: false

# Some specs describe a behaviour rather than a class — the load path, the default logger's
# output — and naming a string subject is the honest way to say so.
RSpec/DescribeClass:
  Enabled: false

# A constant inside an example group is scoped to that group by intent: a fixture address or a
# payload shape belongs to the examples that use it, not to the file.
RSpec/LeakyConstantDeclaration:
  Exclude:
    - "spec/**/*"

# One file per subject, and a subject can have two aspects worth their own describe.
RSpec/MultipleDescribes:
  Enabled: false
